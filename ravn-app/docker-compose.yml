services:
  # ── 1. Nginx Reverse Proxy ──
  ravn-nginx:
    image: ravn-nginx:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: ravn-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      ravn-api:
        condition: service_healthy
    networks:
      - ravn-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── 2. Node.js API Service ──
  ravn-api:
    image: ravn-api:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ravn-api
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_HOST=ravn-mysql
      - DB_PORT=3306
      - DB_USER=ravn_user
      - DB_PASSWORD=ravn_super_secret_password_2026
      - DB_NAME=ravn_db
      - REDIS_HOST=ravn-redis
      - REDIS_PORT=6379
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_51MockStripeSecretKey}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_MockStripeWebhookSecret}
      - LICENSE_PRIVATE_KEY=${LICENSE_PRIVATE_KEY:-}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-ravn_master_admin_key_9988}
      - APP_BASE_URL=${APP_BASE_URL:-https://ravn.purrfectpal.studio}
    depends_on:
      ravn-mysql:
        condition: service_healthy
      ravn-redis:
        condition: service_healthy
    networks:
      - ravn-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── 3. MySQL 8.0 Database ──
  ravn-mysql:
    image: mysql:8.0
    container_name: ravn-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ravn_root_password_2026
      MYSQL_DATABASE: ravn_db
      MYSQL_USER: ravn_user
      MYSQL_PASSWORD: ravn_super_secret_password_2026
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: [
      "--default-authentication-plugin=mysql_native_password",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci"
    ]
    networks:
      - ravn-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pravn_root_password_2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 4. Redis 7.0 Cache ──
  ravn-redis:
    image: redis:7-alpine
    container_name: ravn-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - ravn-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  ravn-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
