worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream Node.js API Service
    upstream ravn_api_upstream {
        server ravn-api:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name ravn.purrfectpal.studio localhost _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        client_max_body_size 100M;

        # Root static files (Web storefront)
        root /usr/share/nginx/html;
        index index.html;

        # Let's Encrypt SSL Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Standalone Activation Portal routes
        location ~ ^/(activate|portal|license)$ {
            try_files /activate.html =404;
        }

        # macOS DMG Download Distribution
        location ~* ^/(assets/macos|download) {
            client_max_body_size 500M;
            add_header Content-Disposition 'attachment';
            add_header Content-Type 'application/x-apple-diskimage';
            add_header Cache-Control 'public, max-age=86400';
            try_files $uri @api_fallback;
        }

        # Fallback to API if static DMG not found locally
        location @api_fallback {
            proxy_pass http://ravn_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health Check
        location /health {
            access_log off;
            return 200 '{"status":"UP","service":"ravn-nginx","domain":"ravn.purrfectpal.studio"}';
            add_header Content-Type application/json;
        }

        # API Reverse Proxy with Rate Limiting
        location /api/ {
            limit_req zone=api_rate_limit burst=20 nodelay;
            limit_conn conn_limit 50;

            proxy_pass http://ravn_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            proxy_connect_timeout 90s;
            proxy_send_timeout 90s;
        }

        # Dedicated Webhook Endpoint (Higher Timeout & Raw Payload Support)
        location /api/v1/webhooks/ {
            proxy_pass http://ravn_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Web App Static Files & SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }
    }
}
