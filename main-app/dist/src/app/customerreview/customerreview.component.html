<h1 class="customer-review-heading mb-2">Customer Reviews</h1>

<div class="page-wrapper">
  <div class="reviews-container">

    <!-- Review 1 -->
    <div class="review-card">
      <div class="review-header">
        <img class="avatar" src="https://purrfectpal.studio/uploadedfiles/testimonials/dinkojun.jpg"
          onerror="this.onerror=null; this.src='/assets/reviews/AD.png';" appDisablerightclick draggable="false"
          oncontextmenu="return false;" alt="Reviewer Avatar" />
        <div class="reviewer-info">
          <span class="reviewer-name">羽鳥ユニカ</span>
          <app-ratingbar class="mt-2" [totalStars]="5" [rating]="5"></app-ratingbar>
        </div>
      </div>
      <div class="review-text">
        Absolutely in love with Max’s portrait — it captures his personality perfectly!
      </div>
      <div class="review-img-wrap">
        <img class="pet-image" src="/assets/reviews/AD.png" appDisablerightclick draggable="false"
          oncontextmenu="return false;" alt="Pet Portrait" />
        <div class="review-proof-layer" aria-hidden="true"></div>
      </div>
    </div>

    <!-- Review 2 -->
    <div class="review-card">
      <div class="review-header">
        <img class="avatar" src="https://purrfectpal.studio/uploadedfiles/testimonials/dmac.jpg"
          onerror="this.onerror=null; this.src='/assets/reviews/TY.png';" appDisablerightclick draggable="false"
          oncontextmenu="return false;" alt="Reviewer Avatar" />
        <div class="reviewer-info">
          <span class="reviewer-name">Daniel Maclennan</span>
          <app-ratingbar class="mt-2" [totalStars]="5" [rating]="4.5"></app-ratingbar>
        </div>
      </div>
      <div class="review-text">
        Buddy's portrait is incredible. It’s like her personality is shining right off the canvas.
      </div>
      <div class="review-img-wrap">
        <img class="pet-image" src="/assets/reviews/TY.png" appDisablerightclick draggable="false"
          oncontextmenu="return false;" alt="Dog Art" />
        <div class="review-proof-layer" aria-hidden="true"></div>
      </div>
    </div>

    <!-- Review 3 -->
    <div class="review-card">
      <div class="review-header">
        <img class="avatar" src="https://purrfectpal.studio/uploadedfiles/testimonials/bindu.jpg"
          onerror="this.onerror=null; this.src='/assets/reviews/WED.png';" appDisablerightclick draggable="false"
          oncontextmenu="return false;" alt="Reviewer Avatar" />
        <div class="reviewer-info">
          <span class="reviewer-name">Suzi Diaz</span>
          <app-ratingbar class="mt-2" [totalStars]="5" [rating]="5"></app-ratingbar>
        </div>
      </div>
      <div class="review-text">
        Felix’s portrait is stunning — it truly captures his spirit.
      </div>
      <div class="review-img-wrap">
        <img class="pet-image" src="/assets/reviews/WED.png" appDisablerightclick draggable="false"
          oncontextmenu="return false;" alt="Cat Art" />
        <div class="review-proof-layer" aria-hidden="true"></div>
      </div>
    </div>

  </div>
</div>
