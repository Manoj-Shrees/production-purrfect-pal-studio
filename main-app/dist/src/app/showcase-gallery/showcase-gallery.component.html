
 <section class="gallery" #galleryRef>

  <div
    *ngFor="let photo of activePhotos; trackBy: trackByPhoto"
    #cardEl
    class="photo-wrapper"
    [class.show]="photo.show"
    [class.exiting]="photo.exiting"
    [class.hovered]="photo.isHovered"
    [ngClass]="photo.entranceDir"
    [style.left.px]="photo.left"
    [style.top.px]="photo.top"
    [style.width.px]="imgWidth"
    [style.height.px]="cardHeight"
    [style.z-index]="photo.zIndex"
    (mouseenter)="onMouseEnter(photo)"
    (mouseleave)="onMouseLeave(photo)"
    (mousemove)="onMouseMove($event, photo, cardEl)"
  >
    <div class="photo-inner" [style.transform]="innerTransform(photo)">
      <div class="img-wrap">
        <img
          [src]="photo.url"
          appDisablerightclick 
          draggable="false" 
          oncontextmenu="return false;"
          onselectstart="return false;"
          ondragstart="return false;"
          style="-webkit-touch-callout: none; -webkit-user-drag: none;"
          alt="Memopix Showcase Artwork"
          loading="lazy"
          decoding="async"
          [class.loaded]="photo.loaded"
          (load)="onImageLoad(photo)"
          (error)="onImageLoad(photo)"
        />
        <div class="img-shine"></div>
        <div class="img-glare"></div>

        <!-- Studio Proof Anti-Screenshot Watermark -->
        <div class="gallery-proof-layer" aria-hidden="true"></div>
      </div>
      <span class="label">{{ photo.label }}</span>
    </div>
  </div>
</section>
