<div class="signup-page-wrapper">
  <div class="container py-5 d-flex justify-content-center align-items-center min-vh-100">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-md-8 col-lg-6 mx-auto">

        <!-- Main Glass Card -->
        <div class="card shadow signup-card mt-4">

          <!-- Floating Logo -->
          <div class="logo-wrapper">
            <a routerLink="/Home" style="cursor:pointer;">
              <img src="/assets/images/pps-logo.png" draggable="false" oncontextmenu="return false;"
                alt="Purrfect Pal Studio Logo" class="logo-circle img-fluid">
            </a>
          </div>

          <!-- Card Body -->
          <div class="card-body text-center pt-5">
            <h1 class="mt-3">Forgot Password?</h1>
            <p class="text-muted mb-4">Enter your email and we'll send a secure reset link.</p>

            <!-- Inner Glass Form -->
            <div class="form-glass-card p-4">

              <!-- Server error banner -->
              <div class="form-error-banner mb-3" *ngIf="serverError()">
                <i class="fa fa-exclamation-circle me-2"></i>{{ serverError() }}
              </div>

              <form #forgotpassForm="ngForm" autocomplete="off" novalidate (ngSubmit)="forgotpass($event, forgotpassForm)">

                <!-- Email -->
                <div class="mb-3 text-start">
                  <label for="forgot-email">Email Address</label>
                  <input
                    class="form-control"
                    [class.is-invalid]="(emailField.errors?.['required'] || emailInvalid()) && emailField.touched"
                    type="email"
                    id="forgot-email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    [(ngModel)]="email"
                    (ngModelChange)="onEmailChange($event)"
                    #emailField="ngModel"
                    required
                  />

                  <!-- Field-level errors -->
                  <div class="input-error" *ngIf="emailField.errors?.['required'] && emailField.touched">
                    Email is required.
                  </div>
                  <div class="input-error" *ngIf="emailInvalid() && emailField.touched">
                    Please enter a valid email address.
                  </div>
                </div>

                <!-- Spinner -->
                <div class="loader-wrapper" *ngIf="isLoading()">
                  <div class="loader"></div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-glass" [disabled]="isLoading() || forgotpassForm.invalid">
                  <span *ngIf="!isLoading()">Send Reset Link</span>
                  <span *ngIf="isLoading()">Sending…</span>
                </button>

                <div class="text-center mt-3">
                  <a routerLink="/Login" style="cursor: pointer; color: #1d9692; font-weight: 500; font-size: 14px; text-decoration: none;">
                    Back to Login
                  </a>
                </div>

              </form>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</div>
