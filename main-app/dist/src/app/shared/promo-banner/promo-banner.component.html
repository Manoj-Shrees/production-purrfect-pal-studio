<div *ngIf="banner && !isDismissed" 
     [style.background]="getBannerGradient()" 
     [style.color]="banner.textColorHex || '#ffffff'" 
     [style.font-size.px]="banner.fontSize || 13" 
     class="promo-banner-container">
  <div class="promo-banner-content">
    <span class="badge" *ngIf="banner.title">{{ banner.title }}</span>
    <span class="message">{{ banner.message }}</span>
    <a *ngIf="banner.ctaText && banner.ctaUrl" 
       [href]="banner.ctaUrl" 
       class="cta-button" 
       [style.color]="banner.startColorHex || '#FF4E50'">
      {{ banner.ctaText }}
    </a>
  </div>
  <button (click)="dismissBanner()" class="close-btn" [style.color]="banner.textColorHex || '#ffffff'">
    <i class="fa fa-times"></i>
  </button>
</div>
